@media (min-width:700px){.joystick{display:block}.hud-left{left:28px}.hud-right{right:30px}.bottom-nav{top:92px}}@media(max-width:600px){.topbar{top:10px;left:12px;right:12px}.brand h1{font-size:15px}.sigil{width:34px;height:34px}.brand small{font-size:7px}.zone{padding:6px 9px}.zone strong{font-size:12px}.zone span{font-size:8px}.mini-map{width:88px;height:75px}.map-title{font-size:7px;padding:5px}.map-grid{inset:22px 6px 6px}.bottom-nav{top:67px;left:12px;right:12px;gap:3px}.nav-btn{padding:6px 2px;font-size:7px;white-space:nowrap;flex:1;text-align:center}.nav-btn span{margin-right:1px}.hud-left{left:12px;bottom:15px;gap:7px}.orb{width:59px;height:59px}.orb-core b{font-size:12px}.orb-core small{font-size:7px}.stats{font-size:8px}.hud-right{right:10px;bottom:12px;transform:scale(.84);transform-origin:bottom right}.joystick{display:block;width:94px;height:94px;left:15px;bottom:96px}.stick{inset:26px}.quest-toast{top:118px;min-width:190px;padding:8px 11px}.quest-toast b{font-size:12px}.modal{padding:16px}.inventory-grid{grid-template-columns:repeat(3,1fr)}}

<body><main id="game"><canvas id="world"></canvas><div class="vignette"></div>
<header class="topbar"><div class="brand"><div class="sigil">✦</div><div><h1>KÜL YEMİNİ</h1><small>UNUTULMUŞ TOPRAKLAR</small></div></div><div class="zone"><strong>Kül Geçidi</strong><span>SEVİYE 1 · TEHLİKE: DÜŞÜK</span></div><div class="mini-map"><div class="map-title">BÖLGE HARİTASI</div><div class="map-grid"><i class="map-player"></i></div></div></header>
<nav class="bottom-nav"><button class="nav-btn" data-panel="character"><span>◈</span> KARAKTER</button><button class="nav-btn" data-panel="inventory"><span>▣</span> ÇANTA <b id="item-count">0</b></button><button class="nav-btn" data-panel="craft"><span>⚒</span> DÖVME</button><button class="nav-btn" data-panel="tree"><span>✧</span> YETENEK</button><button class="nav-btn" data-panel="quest"><span>♧</span> GÖREV</button><button class="nav-btn" data-panel="dungeon"><span>☠</span> MÜHÜR</button></nav>
<div class="quest-toast"><b id="quest-title">Kampın İsteği</b><small id="quest-copy">5 kül kurdu avla · Ödül: 60 XP + 1 Öz</small></div><div class="combat-label" id="combat-label">KÜL KURDU</div>
<div class="hud-left"><div class="orb health"><div class="orb-core"><b id="hp-text">100</b><small>CAN</small></div></div><div class="orb mana"><div class="orb-core"><b id="mp-text">60</b><small>ÖZ</small></div></div><div class="stats"><strong>Lv. <span id="level">1</span> Gezgin</strong><br>XP <span id="xp">0</span> / <span id="xp-next">100</span><br>⚔ <span id="dmg">12</span> &nbsp; ◈ <span id="gold">42</span></div></div>
<div class="hud-right"><button class="skill-button interact" id="interact" aria-label="Etkileşim"><span class="icon">✧</span><span class="key">ETKİLEŞ</span></button><button class="skill-button skill1" id="skill" aria-label="Kor alevi"><span class="icon">♨</span><span class="key">KOR ALEVİ · Q</span><span class="cooldown"></span></button><button class="skill-button skill2" id="skill2" aria-label="Kül patlaması"><span class="icon">✹</span><span class="key">KÜL PATLAMASI · E</span><span class="cooldown"></span></button><button class="skill-button dodge" id="dodge" aria-label="Atıl"><span class="icon">➤</span><span class="key">ATIL · SPACE</span></button><button class="skill-button attack" id="attack" aria-label="Saldır"><span class="icon">⚔</span><span class="key">SALDIR · BASILI TUT</span></button></div>

<div class="modal-backdrop" id="backdrop"><section class="modal" id="modal"></section></div></main>
<script>
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d');const game=document.querySelector('#game');
let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const player={x:0,y:0,r:13,hp:100,maxHp:100,mp:60,maxMp:60,xp:0,next:100,level:1,dmg:12,gold:42,faceX:1,faceY:0,invuln:0,dash:0};let enemies=[],drops=[],particles=[],inventory=[],materials={"Kül Özü":1,"Kurt Postu":0,"Demir Cevheri":2},kills=0,attackHeld=false,attackTimer=0,skillCD=0,skill2CD=0,questDone=false,mastery={"Kısa Kılıç":0,"Kor Alevi":0,"Kül Patlaması":0},treePoints=0,treeBought={};const keys={},joy={x:0,y:0},camera={x:0,y:0};
function spawnEnemy(x,y,type='wolf'){enemies.push({x,y,type,r:type==='brute'?18:13,hp:type==='brute'?55:32,max:type==='brute'?55:32,speed:type==='brute'?25:37,attack:0,wind:0,hitFlash:0,phase:Math.random()*5})}
for(let i=0;i<7;i++)spawnEnemy((Math.random()-.5)*620,(Math.random()-.5)*470,i===6?'brute':'wolf');
function rand(a,b){return a+Math.random()*(b-a)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function particle(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-90,90),vy:rand(-100,55),life:rand(.25,.65),max:.65,color,r:rand(2,4)})}
function updateHUD(){document.querySelector('#hp-text').textContent=Math.ceil(player.hp);document.querySelector('#mp-text').textContent=Math.floor(player.mp);document.querySelector('#level').textContent=player.level;document.querySelector('#xp').textContent=player.xp;document.querySelector('#xp-next').textContent=player.next;document.querySelector('#dmg').textContent=player.dmg;document.querySelector('#gold').textContent=player.gold;document.querySelector('#item-count').textContent=inventory.length;document.querySelector('.health').style.setProperty('--fill',`${player.hp/player.maxHp*100}%`);document.querySelector('.mana').style.setProperty('--fill',`${player.mp/player.maxMp*100}%`);document.querySelector('#quest-copy').textContent=questDone?'Tamamlandı · Ödül alındı':'5 kül kurdu avla · Ödül: 60 XP + 1 Öz'}
function gainXP(n){player.xp+=n;if(player.xp>=player.next){player.xp-=player.next;player.level++;player.next=Math.round(player.next*1.35);player.maxHp+=12;player.hp=player.maxHp;player.dmg+=2;treePoints++;notify('SEVİYE ATLADIN',`Seviye ${player.level} · +1 Yetenek Puanı`)}updateHUD()}
let labelTimer=0;function notify(title,copy){document.querySelector('#quest-title').textContent=title;document.querySelector('#quest-copy').textContent=copy;labelTimer=3}
function aimTarget(range=110){let best=null,bd=range;for(const e of enemies){let d=dist(player,e);if(d<bd){bd=d;best=e}}return best}
function attack(){if(attackTimer>0)return;attackTimer=.38;const e=aimTarget(78);if(e){const a=Math.atan2(e.y-player.y,e.x-player.x);player.faceX=Math.cos(a);player.faceY=Math.sin(a);e.hp-=player.dmg+Math.floor(mastery['Kısa Kılıç']/12)*2;e.hitFlash=.14;particle(e.x,e.y,'#f3c477',7);mastery['Kısa Kılıç']+=1;if(e.hp<=0)killEnemy(e)}else{particle(player.x+player.faceX*25,player.y+player.faceY*25,'#d7c18e',3)}}
function castSkill(which){const cd=which===1?skillCD:skill2CD;if(cd>0)return;const cost=which===1?16:28;if(player.mp<cost){notify('ÖZ YETERSİZ','Özün yenilenmesini bekle.');return}player.mp-=cost;if(which===1){skillCD=3.1;mastery['Kor Alevi']+=1;let e=aimTarget(225);let tx=e?e.x:player.x+player.faceX*150,ty=e?e.y:player.y+player.faceY*150;particle(tx,ty,'#ff9b48',24);for(const enemy of enemies)if(Math.hypot(enemy.x-tx,enemy.y-ty)<50){enemy.hp-=31+player.level*3+Math.floor(mastery['Kor Alevi']/10)*2;enemy.hitFlash=.2;if(enemy.hp<=0)killEnemy(enemy)}}else{skill2CD=6.5;mastery['Kül Patlaması']++;particle(player.x,player.y,'#9b8cff',30);for(const enemy of enemies)if(dist(player,enemy)<105){enemy.hp-=23+player.level*2+Math.floor(mastery['Kül Patlaması']/10)*2;enemy.hitFlash=.2;if(enemy.hp<=0)killEnemy(enemy)}}updateHUD()}
function killEnemy(e){let idx=enemies.indexOf(e);if(idx<0)return;enemies.splice(idx,1);kills++;gainXP(e.type==='brute'?38:22);particle(e.x,e.y,'#d7ae6d',18);drops.push({x:e.x,y:e.y,type:Math.random()<(.22+(rage?.08:0)+(risk?.10:0))?'gear':Math.random()<.5?'ore':'hide',life:40});if(!questDone&&kills>=5){questDone=true;gainXP(60);materials['Kül Özü']++;player.gold+=30;notify('KAMP GÖREVİ TAMAMLANDI','+60 XP · +1 Kül Özü · +30 Altın')}if(enemies.length<5){setTimeout(()=>{if(enemies.length<7)spawnEnemy(rand(-300,300),rand(-230,230),Math.random()<.18?'brute':'wolf')},1300)}}
function nearestDrop(){let d=null,bd=65;for(let x of drops){let q=dist(player,x);if(q<bd){bd=q;d=x}}return d}function interact(){let d=nearestDrop();if(d){let i=drops.indexOf(d);drops.splice(i,1);if(d.type==='ore'){materials['Demir Cevheri']++;notify('DEMİR CEVHERİ','Malzemeler çantana eklendi.')}else if(d.type==='hide'){materials['Kurt Postu']++;notify('KURT POSTU','Malzemeler çantana eklendi.')}else{let prefix=['Yırtıcı','Korla İşlenmiş','Gezginin','Sessiz','Kadim'][Math.floor(Math.random()*5)],suffix=['Kılıcı','Miğferi','Yüzüğü','Tılsımı'][Math.floor(Math.random()*4)];let item={name:`${prefix} ${suffix}`,slot:Math.random()<.5?'Silah':'Miğfer',rarity:Math.random()<.18?'Efsanevi':'Büyülü',dmg:Math.floor(rand(3,8))+player.level*2,affix:Math.random()<.5?'+4 Can':'%5 Kritik Şansı'};inventory.push(item);notify('GANİMET BULUNDU',`${item.rarity} ${item.name} · +${item.dmg} Hasar`) }updateHUD();return}let e=aimTarget(90);if(e){notify('DÜŞMAN YAKIN','Saldırmak için ⚔ düğmesine bas.');return}notify('KÜL GEÇİDİ','Keşfet, düşmanları alt et ve ganimetini topla.')}
function dodge(){if(player.dash>0||player.mp<8)return;player.mp-=8;player.dash=.22;player.invuln=.45;let dx=joy.x||((keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)),dy=joy.y||((keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0));if(!dx&&!dy){dx=player.faceX;dy=player.faceY}let l=Math.hypot(dx,dy)||1;player.vx=dx/l*490;player.vy=dy/l*490;particle(player.x,player.y,'#a8c9bd',8);updateHUD()}
function drawGround(){ctx.fillStyle='#28372b';ctx.fillRect(-W,-H,W*3,H*3);ctx.strokeStyle='#71835b12';ctx.lineWidth=1;for(let x=-1000;x<1000;x+=64){ctx.beginPath();ctx.moveTo(x,-1000);ctx.lineTo(x,1000);ctx.stroke()}for(let y=-1000;y<1000;y+=64){ctx.beginPath();ctx.moveTo(-1000,y);ctx.lineTo(1000,y);ctx.stroke()}for(let i=0;i<38;i++){let x=Math.sin(i*134.4)*420,y=Math.cos(i*64.2)*330;ctx.fillStyle=i%3?'#1f2c23':'#354330';ctx.beginPath();ctx.ellipse(x,y,randSeed(i,8,19),randSeed(i,5,12),i,0,Math.PI*2);ctx.fill();if(i%5===0){ctx.strokeStyle='#746d4b77';ctx.beginPath();ctx.moveTo(x-7,y+6);ctx.lineTo(x+8,y-7);ctx.stroke()}}}
function randSeed(i,a,b){let v=Math.sin(i*127.1+83.3)*43758.5453;return a+(v-Math.floor(v))*(b-a)}
function drawEnemy(e){let x=e.x,y=e.y;ctx.save();ctx.translate(x,y);if(e.type==='brute'){ctx.fillStyle='#32372e';ctx.beginPath();ctx.ellipse(0,8,16,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=e.hitFlash?'#ffcf91':'#76604b';ctx.beginPath();ctx.ellipse(0,0,16,17,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d99b59';ctx.beginPath();ctx.moveTo(-10,-13);ctx.lineTo(-18,-24);ctx.lineTo(-6,-18);ctx.fill();ctx.beginPath();ctx.moveTo(10,-13);ctx.lineTo(18,-24);ctx.lineTo(6,-18);ctx.fill()}else{ctx.fillStyle='#232b22';ctx.beginPath();ctx.ellipse(0,7,12,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=e.hitFlash?'#fff0c4':'#89735b';ctx.beginPath();ctx.ellipse(0,0,12,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#92785c';ctx.beginPath();ctx.moveTo(-8,-7);ctx.lineTo(-11,-18);ctx.lineTo(-2,-10);ctx.moveTo(8,-7);ctx.lineTo(11,-18);ctx.lineTo(2,-10);ctx.fill()}ctx.fillStyle='#ff8960';ctx.fillRect(-5,-2,2,2);ctx.fillRect(3,-2,2,2);if(e.wind>0){ctx.strokeStyle='#ff6c48bb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,e.r+10,-Math.PI/2,-Math.PI/2+((.6-e.wind)/.6)*Math.PI*2);ctx.stroke()}ctx.restore();ctx.fillStyle='#171915';ctx.fillRect(x-16,y-e.r-17,32,4);ctx.fillStyle='#bd6351';ctx.fillRect(x-16,y-e.r-17,32*Math.max(0,e.hp/e.max),4)}
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.034,(now-(frame.last||now))/1000);frame.last=now;let mx=joy.x+((keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)),my=joy.y+((keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0));let ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}if(ml){player.faceX=mx;player.faceY=my}const speed=player.dash>0?1:155;player.x+=(mx*speed+(player.vx||0))*dt;player.y+=(my*speed+(player.vy||0))*dt;player.vx=(player.vx||0)*Math.max(0,1-dt*7);player.vy=(player.vy||0)*Math.max(0,1-dt*7);player.dash=Math.max(0,player.dash-dt);player.invuln=Math.max(0,player.invuln-dt);attackTimer=Math.max(0,attackTimer-dt);skillCD=Math.max(0,skillCD-dt);skill2CD=Math.max(0,skill2CD-dt);if(attackHeld)attack();player.mp=Math.min(player.maxMp,player.mp+dt*2.3);if(Math.random()<dt*.4)updateHUD();
for(const e of enemies){let d=dist(player,e);e.hitFlash=Math.max(0,e.hitFlash-dt);e.phase+=dt;if(e.wind>0){e.wind-=dt;if(e.wind<=0&&dist(player,e)<e.r+28&&player.invuln<=0){player.hp=Math.max(0,player.hp-(e.type==='brute'?18:10)*(rage?1.4:1));player.invuln=.55;particle(player.x,player.y,'#e56a53',9);updateHUD();if(player.hp<=0){player.hp=player.maxHp;player.mp=player.maxMp;player.x=0;player.y=0;player.gold=Math.max(0,player.gold-8);let lost='';if(risk){for(const k of Object.keys(materials)){let n=Math.floor(materials[k]*.25);materials[k]-=n;if(n)lost+=`${n} ${k}, `}}notify('CADI YENİLDİ',`Kampa döndün · 8 Altın kaybettin.${lost?' Düştü: '+lost:''}`);updateHUD()}}}else if(d<210){if(d>e.r+player.r+8){e.x+=(player.x-e.x)/d*e.speed*dt;e.y+=(player.y-e.y)/d*e.speed*dt}else if(Math.random()<dt*.6)e.wind=.62}}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.96;p.vy+=65*dt}particles=particles.filter(p=>p.life>0);drops=drops.filter(d=>d.life-->0);camera.x+=(player.x-camera.x)*Math.min(1,dt*5);camera.y+=(player.y-camera.y)*Math.min(1,dt*5);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2-camera.x,H/2-camera.y);drawGround();for(const d of drops){ctx.fillStyle=d.type==='gear'?'#f0ca72':d.type==='ore'?'#aab0a4':'#9e7c5e';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(d.x,d.y,6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(const e of enemies)drawEnemy(e);ctx.globalAlpha=player.invuln>0&&Math.floor(now/70)%2?.35:1;ctx.fillStyle='#171d17';ctx.beginPath();ctx.ellipse(player.x,player.y+9,13,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d0b779';ctx.beginPath();ctx.arc(player.x,player.y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#49604a';ctx.beginPath();ctx.moveTo(player.x-9,player.y+4);ctx.lineTo(player.x-7,player.y+15);ctx.lineTo(player.x+7,player.y+15);ctx.lineTo(player.x+9,player.y+4);ctx.fill();ctx.strokeStyle='#e3d3a6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(player.x+player.faceX*7,player.y+player.faceY*7);ctx.lineTo(player.x+player.faceX*25-player.faceY*4,player.y+player.faceY*25+player.faceX*4);ctx.stroke();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore();if(labelTimer>0)labelTimer-=dt;document.querySelector('#combat-label').style.opacity=labelTimer>0?1:0;let q=nearestDrop();document.querySelector('#interact').style.opacity=q?1:.75}
requestAnimationFrame(frame);
const backdrop=document.querySelector('#backdrop'),modal=document.querySelector('#modal');function openPanel(name){backdrop.style.display='flex';if(name==='inventory'){modal.innerHTML=`<div class="modal-head"><h2>Gezginin Çantası</h2><button class="close">×</button></div><p>Ganimetini incele. Eşya karşılaştırmaları temel hasar değerine göre hesaplanır.</p><div class="inventory-grid">${inventory.length?inventory.map((it,i)=>`<button class="item" data-equip="${i}"><strong>${it.name}</strong>${it.rarity} ${it.slot}<br>⚔ ${player.dmg} → ${player.dmg+it.dmg} Hasar<br>${it.affix||'Dövme: +hasar'}<br><span style="color:#8eaa7a">Dokun: kuşan</span></button>`).join(''):'<div class="card"><h3>Çanta boş</h3><small>Kül Geçidi yaratıklarını yen, parlayan ganimeti almak için ✧ düğmesine yaklaş.</small></div>'}</div><h3 style="font:16px Marcellus;color:#e5d3ab;margin-top:18px">Malzemeler</h3>${Object.entries(materials).map(([k,v])=>`<div class="statline"><span>${k}</span><b>${v}</b></div>`).join('')}<div class="hint">Taşıma kapasitesi: ${inventory.length}/24 · Eşyalar bu keşif boyunca saklanır.</div>`}
else if(name==='character'){modal.innerHTML=`<div class="modal-head"><h2>Gezgin · Seviye ${player.level}</h2><button class="close">×</button></div><div class="cards"><div class="card"><div class="rarity">SAVAŞÇI</div><h3>Kül Yemini</h3><small>Aktif, konumlanma odaklı yakın dövüş. Her saldırı, atılma ve büyü oyuncu girdisiyle gerçekleşir.</small></div><div class="card"><div class="rarity">SAVAŞ DEĞERLERİ</div><h3>${player.dmg} Hasar</h3><small>Can ${Math.ceil(player.hp)}/${player.maxHp}<br>Öz ${Math.floor(player.mp)}/${player.maxMp}<br>Altın ${player.gold}</small></div></div><h3 style="font:16px Marcellus;color:#e5d3ab;margin-top:18px">Silah Ustalığı</h3>${Object.entries(mastery).map(([k,v])=>`<div class="statline"><span>${k}</span><b>${v} kullanım · Kademe ${Math.floor(v/12)+1}</b></div>`).join('')}<p>Ustalık yalnızca ilgili eylemi savaşta aktif kullandığında artar. Her 12 kullanım küçük bir hasar / güç bonusu verir.</p>`}
else if(name==='tree'){let nodes=[['Kılıç Ustalığı','Temel saldırı hasarı +3',3],['Kor Korosu','Kor Alevi hasarı +25%',2],['Çevik Adım','Atılma öz bedeli −3',2],['Derin Öz','Azami öz +20',2],['Canlı Zırh','Azami can +20',2],['Patlama Ustası','Kül Patlaması yarıçapı +20%',2]];modal.innerHTML=`<div class="modal-head"><h2>Yetenek Ağı</h2><button class="close">×</button></div><p>Doğrusal olmayan ustalık dalları. Seviye atlamak 1 yetenek puanı kazandırır. Bir düğüme dokunarak aç.</p><div class="statline"><span>Dağıtılabilir puan</span><b>${treePoints}</b></div><div class="cards" style="margin-top:12px">${nodes.map(([n,d,c],i)=>`<div class="card"><div class="rarity">${i<2?'SİLAH':i<4?'ÖZ':'HAYATTA KALMA'} · ${c} PUAN</div><h3>${n}</h3><small>${d}</small><br><button class="action" data-node="${i}" ${treeBought[i]?'disabled':''}>${treeBought[i]?'AÇILDI':`AÇ · ${c} P`}</button></div>`).join('')}</div>`}
else if(name==='craft'){let can=materials['Kurt Postu']>=3&&materials['Demir Cevheri']>=2;modal.innerHTML=`<div class="modal-head"><h2>Gezgin Demirhanesi</h2><button class="close">×</button></div><p>Mağaralardan cevher, yaratıklardan bileşen topla. Üretim garantilidir; efsanevi eşya arayışı hâlâ ganimet düşüşüne bağlı.</p><div class="cards"><div class="card"><div class="rarity">SİLAH · NADİR</div><h3>Kül Döven</h3><small>⚒ 2 Demir Cevheri<br>⚒ 3 Kurt Postu<br>⚒ 35 Altın<br><br>Bir sonraki saldırı hasarını artıran dövme kılıcı.</small><br><button class="action" id="forge" ${can&&player.gold>=35?'':'disabled'}>ÜRET</button></div><div class="card"><div class="rarity">KAYNAK DÖNGÜSÜ</div><h3>Keşif alanı</h3><small>Demir: ${materials['Demir Cevheri']}<br>Kurt postu: ${materials['Kurt Postu']}<br>Kül özü: ${materials['Kül Özü']}<br>Çevredeki kaynakları topla; nadir damarlar tehlikeli bölgelerde bulunur.</small></div></div><div class="hint">Üretim, dokunmatik ekran için tek adımlı onayla çalışır.</div>`}
else if(name==='dungeon'){modal.innerHTML=`<div class="modal-head"><h2>Tehlike Mührü</h2><button class="close">×</button></div><p>İsteğe bağlı zorluk çarpanları. Savaş alanında aktif kalır. Ölümde normalde 8 altın kaybedersin; Riskli Keşif'te çantandaki malzemelerin bir kısmı da düşer.</p><div class="cards"><div class="card"><div class="rarity">GÜÇLÜ DÜŞMANLAR</div><h3>Kızıl Öfke</h3><small>Düşmanlar +%40 can ve hasar. Ganimet şansı +%35.</small><button class="action" id="rage">MÜHRÜ DEĞİŞTİR</button></div><div class="card"><div class="rarity">YÜKSEK RİSK</div><h3>Riskli Keşif</h3><small>Ölümde malzemelerinin %25'i düşer. Nadir ganimet şansı +%50.</small><button class="action" id="risk">MÜHRÜ DEĞİŞTİR</button></div></div><div class="hint">Mühürler isteğe bağlıdır. Normal keşif dengesi değiştirilmez.</div>`}
else if(name==='quest'){modal.innerHTML=`<div class="modal-head"><h2>Kamp Ateşi</h2><button class="close">×</button></div><div class="card"><div class="rarity">YARDIMCI YAN GÖREV</div><h3>Kurdun Postu</h3><small>5 kül kurdunu avla. Kısa, anlatı yükü taşımayan bir av görevi; teçhizat aralığını aşarken destek olmak için tasarlandı.</small><div class="statline"><span>İlerleme</span><b>${Math.min(kills,5)} / 5</b></div><div class="statline"><span>Ödül</span><b>60 XP · 1 Kül Özü · 30 Altın</b></div></div><p>Görev öldürme ilerlemesiyle otomatik tamamlanır; ödül doğrudan verilir.</p>`}modal.querySelector('.close')?.addEventListener('click',closePanel);modal.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{let it=inventory[+b.dataset.equip];player.dmg+=it.dmg;inventory.splice(+b.dataset.equip,1);updateHUD();openPanel('inventory');notify('EŞYA KUŞANILDI',`${it.name} · +${it.dmg} Hasar`)});modal.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{let i=+b.dataset.node,c=[3,2,2,2,2,2][i];if(treePoints<c)return;treePoints-=c;treeBought[i]=true;if(i===0)player.dmg+=3;if(i===3){player.maxMp+=20;player.mp+=20}if(i===4){player.maxHp+=20;player.hp+=20}if(i===1)mastery['Kor Alevi']+=0;updateHUD();openPanel('tree')});modal.querySelector('#forge')?.addEventListener('click',()=>{materials['Kurt Postu']-=3;materials['Demir Cevheri']-=2;player.gold-=35;inventory.push({name:'Kül Döven',slot:'Silah',rarity:'Nadir',dmg:11+player.level});updateHUD();openPanel('craft');notify('DÖVME TAMAMLANDI','Kül Döven üretildi.')});modal.querySelector('#rage')?.addEventListener('click',()=>{rage=!rage;enemies.forEach(e=>{e.max*=rage?1.4:1/1.4;e.hp=e.max;e.speed*=rage?1.2:1/1.2});notify('KIZIL ÖFKE',rage?'Mühür etkin · Ganimet şansı yükseldi':'Mühür kaldırıldı');openPanel('dungeon')});modal.querySelector('#risk')?.addEventListener('click',()=>{risk=!risk;notify('RİSKLİ KEŞİF',risk?'Malzeme kaybı ve ganimet bonusu etkin':'Risk mührü kaldırıldı');openPanel('dungeon')})}
function closePanel(){backdrop.style.display='none'}let rage=false,risk=false;document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.panel)));document.querySelector('#interact').addEventListener('click',interact);backdrop.addEventListener('click',e=>{if(e.target===backdrop)closePanel()});
const bindHold=(id,fn)=>{let el=document.querySelector(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);fn(true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>fn(false)))};bindHold('#attack',v=>attackHeld=v);document.querySelector('#skill').addEventListener('pointerdown',e=>{e.preventDefault();castSkill(1)});document.querySelector('#skill2').addEventListener('pointerdown',e=>{e.preventDefault();castSkill(2)});document.querySelector('#dodge').addEventListener('pointerdown',e=>{e.preventDefault();dodge()});
const stickEl=document.querySelector('#joystick'),stick=document.querySelector('#stick');let joyPointer=null;function joyMove(e){let r=stickEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}stickEl.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;stickEl.setPointerCapture(e.pointerId);joyMove(e)});stickEl.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joyMove(e)});function joyEnd(){joyPointer=null;joy.x=joy.y=0;stick.style.transform=''}stickEl.addEventListener('pointerup',joyEnd);stickEl.addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key.toLowerCase()==='j')attackHeld=true;if(e.key===' '||e.key==='Shift')dodge();if(e.key.toLowerCase()==='q')castSkill(1);if(e.key.toLowerCase()==='e')castSkill(2);if(e.key==='f'||e.key==='Enter')interact();if(e.key.toLowerCase()==='i')openPanel('inventory');if(e.key.toLowerCase()==='c')openPanel('character');if(e.key.toLowerCase()==='t')openPanel('tree')});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys[e.key]=false;if(e.key.toLowerCase()==='j')attackHeld=false});updateHUD();
